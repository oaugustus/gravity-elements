<section class="demo-section">
  <h2>geKbd</h2>
  <p class="demo-hint">
    Teclas com mapa de símbolos (shift→⇧, command/meta→⌘, …). Espelha Value
    (K) e Value especial (meta→⌘) da doc.
  </p>
  <div class="demo-row">
    <ge-kbd value="K"></ge-kbd>
    <ge-kbd value="meta"></ge-kbd>
    <ge-kbd value="shift"></ge-kbd>
  </div>
</section>

<section class="demo-section">
  <h3>Variações</h3>
  <div class="demo-row">
    <div class="demo-item">
      <span class="label">atalho</span>
      <div class="demo-row">
        <ge-kbd value="command"></ge-kbd>
        <span>+</span>
        <ge-kbd value="shift"></ge-kbd>
        <span>+</span>
        <ge-kbd value="P"></ge-kbd>
      </div>
    </div>
    <div class="demo-item">
      <span class="label">color / variant</span>
      <div class="demo-row">
        <ge-kbd value="enter" color="primary" variant="solid"></ge-kbd>
        <ge-kbd value="esc" color="neutral" variant="outline"></ge-kbd>
        <ge-kbd value="tab" color="info" variant="soft"></ge-kbd>
      </div>
    </div>
    <div class="demo-item">
      <span class="label">sizes</span>
      <div class="demo-row">
        <ge-kbd value="sm" size="sm"></ge-kbd>
        <ge-kbd value="md" size="md"></ge-kbd>
        <ge-kbd value="lg" size="lg"></ge-kbd>
      </div>
    </div>
  </div>
